# Builds the addon zip and uploads it to CurseForge (and a GitHub release)
# every time a version tag like v0.9.0 is pushed.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # CurseForge gets only this version's notes, as HTML (the tag's CHANGELOG.md section).
      # Fails when CHANGELOG.md has no section for the tag.
      - name: Write the release notes
        run: python3 tools/release_notes.py "$GITHUB_REF_NAME" > RELEASE_NOTES.html

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        with:
          # If CurseForge can't match interface 16001 to a game version, set the
          # Forever version label CurseForge shows (e.g. -g 1.60.1) in the
          # FOREVER_GAME_VERSION repository variable.
          args: ${{ vars.FOREVER_GAME_VERSION != '' && format('-g {0}', vars.FOREVER_GAME_VERSION) || '' }}
