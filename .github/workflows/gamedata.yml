# Watches WoW: Forever for new client builds. When one appears it rebuilds
# tools/reference/forever.json from the client's own tables (via wago.tools), audits
# Data.lua against it and opens a pull request listing what changed in the game and
# which guide entries now look wrong. It never edits Data.lua and never releases.
# Follow tools/UPDATING.md to act on the pull request.
#
# One-time setup: Settings > Actions > General > Workflow permissions >
# tick "Allow GitHub Actions to create and approve pull requests".
name: Game data

on:
  schedule:
    - cron: "23 7 * * *"   # daily, 07:23 UTC
  workflow_dispatch:
    inputs:
      build:
        description: "Forever build to compare against (blank = newest)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lupa (reads Data.lua)
        run: pip install lupa

      - name: Fetch the Forever build and compare
        id: gd
        env:
          BUILD: ${{ github.event.inputs.build }}
        run: |
          python tools/gamedata.py update ${BUILD:+--build "$BUILD"} --report gamedata-report.md || true
          echo "build=$(python -c 'import json; print(json.load(open("tools/reference/forever.json"))["build"])')" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- tools/reference/forever.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request
        if: steps.gd.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD: ${{ steps.gd.outputs.build }}
        run: |
          branch="gamedata/$BUILD"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "A pull request branch for $BUILD already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add tools/reference/forever.json
          git commit -m "Game data: WoW Forever $BUILD"
          git push origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "Game data: WoW Forever $BUILD" --body-file gamedata-report.md
